# diag.conf -- configuration for diag.dll / uxdiag.exe
#
# Must sit next to the hook DLL (default: the same directory as diag.dll).
# One key=value per line; '#' starts a comment. Missing keys fall back to
# the built-in defaults shown below.

logdir=C:\Users\Public
logname=DIAG.log
logrotate=0
# scope: comma-separated list of image file names. If non-empty, only processes
# whose image file name matches one of the entries will rotate/create/append the
# log; all others are ignored silently. Empty or omitted -> no restriction
# (behavior unchanged). Match is case-insensitive and any path in an entry is
# stripped, so "svchost.exe" and "C:\Windows\System32\svchost.exe" both match
# svchost.exe. No wildcards; whitespace around entries is ignored.
# Example: scope=svchost.exe,notepad.exe
scope=
